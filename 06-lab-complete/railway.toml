# ============================================================
# Railway deploy config (tiêu chí 12)
#   Build bằng Dockerfile; Railway cấp PORT qua env, CMD trong Dockerfile đã dùng ${PORT:-8000}.
#   Secret (AGENT_API_KEY) và REDIS_URL đặt trong Railway Variables, KHÔNG ghi ở đây.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
